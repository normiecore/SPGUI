[package]
name = "deja"
version = "0.4.0"
description = "Deja — a local memory and workflow layer for Screenpipe on Windows"
authors = ["normiecore"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library crate name distinct from the binary name
# (required on Windows, see rust-lang/cargo#8519).
name = "deja_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
